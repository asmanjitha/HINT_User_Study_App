# Python logging.config.dictConfig-compatible configuration.
# The "file" handler's filename is resolved relative to the configured
# logs_dir at load time by core.logging_setup.

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: "system.log"
    maxBytes: 5242880
    backupCount: 5
    encoding: utf8

root:
  level: DEBUG
  handlers: [console, file]
